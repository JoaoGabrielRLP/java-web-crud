<!DOCTYPE HTML>
<html>
    <head>
        <title>Cadastro de produtos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form method="post" action="salvar_produtos.jsp">
            <p>
                <label for="codigo">Codigo do produto</label>
                <input type="number" name="codigo" id="codigo" min="1" required>
            </p>
            
            <p>
                <label for="nome">Nome do produto:</label> 
                <input type="text" name="nome" id="nome" size="50" maxlength="50" required>
            </p>
            
            <p>
                <label for="marca">Marca:</label> 
                <input type="text" name="marca" id="marca" size="50" maxlength="50" required>
            </p>
            
            <p>
                <label for="preco">Preço:</label> 
                <input type="number" name="preco" id="preco" min="0" step="0.01" required>
            </p>
            
            <p>
                <input type="submit" value="salvar">
            </p>
        </form> <!-- O métooo post faz com que as informações colocadas no formulário sejam enviadas e não apareçam na URL -->
    </body>
</html>
