<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastrar produto</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="pagina-conteudo">
        <h1>Cadastrar produto</h1>
        <form class="formulario" method="post" action="salvar_produtos.jsp">
            <label for="codigo">Codigo</label>
            <input type="number" name="codigo" id="codigo" min="1" required>

            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" maxlength="50" required>

            <label for="marca">Marca</label>
            <input type="text" name="marca" id="marca" maxlength="50" required>

            <label for="preco">Preco</label>
            <input type="number" name="preco" id="preco" min="0" step="0.01" required>

            <button type="submit">Salvar</button>
        </form>
    </body>
</html>
